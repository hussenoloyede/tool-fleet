<header class="app-bar">
  <div class="bar-inner">
    <a class="brand" routerLink="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" />
        <path d="M5 17h5l2.5-7 4 13 3-9 2 3H27" />
      </svg>
      ToolFleet
    </a>
    <nav aria-label="Main">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Fleet</a>
      <a routerLink="/firmware" routerLinkActive="active">Firmware</a>
      <a routerLink="/rollouts" routerLinkActive="active">Rollouts</a>
      <a routerLink="/audit" routerLinkActive="active">Audit log</a>
    </nav>
    <span class="api-state" [attr.data-state]="apiState()" role="status">{{ apiLabel[apiState()] }}</span>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="app-footer">
  <div class="bar-inner">
    <span>ToolFleet · staged firmware rollouts for downhole tools</span>
    <span class="links">
      <span>.NET 10 · Angular 22 · Azure</span>
      <a href="https://github.com/hussenoloyede/tool-fleet" rel="noopener" target="_blank">Source on GitHub</a>
    </span>
  </div>
</footer>
