# Azure DevOps pipeline: runs on every push and pull request to main.
# Stage 1 builds and tests the API and the Angular app and publishes both as artifacts.
# Stage 2 deploys main to Azure App Service, which talks to Azure SQL.

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

# Where the jobs run. Pushes use the default. To run once on the other kind of machine,
# use "Run pipeline" in Azure DevOps and pick it from the list.
#   Microsoft-hosted: Microsoft's cloud machines, pinned to Ubuntu 24.04 so the OS only changes when we choose.
#                     The organisation's free tier gives 1,800 minutes a month.
#   Self-hosted: an agent installed on your own PC in the "Default" pool, if the free minutes run out.
parameters:
  - name: buildMachine
    displayName: Build machine
    type: string
    default: Microsoft-hosted
    values:
      - Self-hosted
      - Microsoft-hosted

variables:
  buildConfiguration: Release
  # Must match the names created in Azure and Azure DevOps (see docs/azure-setup.md).
  azureServiceConnection: toolfleet-azure
  webAppName: toolfleet-hussein

stages:
  - stage: Build
    displayName: Build and test
    jobs:
      - job: Api
        displayName: API (.NET)
        pool:
          ${{ if eq(parameters.buildMachine, 'Microsoft-hosted') }}:
            vmImage: ubuntu-24.04
          ${{ else }}:
            name: Default
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK from global.json
            inputs:
              useGlobalJson: true

          - script: dotnet restore
            displayName: Restore

          - script: dotnet build --no-restore --configuration $(buildConfiguration)
            displayName: Build (warnings are errors in CI)

          - script: >
              dotnet test --no-build --configuration $(buildConfiguration)
              --logger trx
              --results-directory $(Agent.TempDirectory)/TestResults
              --collect "XPlat Code Coverage"
            displayName: Test

          - task: PublishTestResults@2
            displayName: Publish test results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "**/*.trx"
              searchFolder: $(Agent.TempDirectory)/TestResults

          - task: PublishCodeCoverageResults@2
            displayName: Publish code coverage
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: $(Agent.TempDirectory)/TestResults/**/coverage.cobertura.xml

          - script: >
              dotnet publish src/ToolFleet.Api --no-build --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)/api
            displayName: Publish API

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api
            displayName: Upload API artifact

      - job: Web
        displayName: Web (Angular)
        pool:
          ${{ if eq(parameters.buildMachine, 'Microsoft-hosted') }}:
            vmImage: ubuntu-24.04
          ${{ else }}:
            name: Default
        steps:
          - task: UseNode@1
            displayName: Install Node 24
            inputs:
              version: 24.x

          - script: npm ci
            displayName: Install packages
            workingDirectory: web

          - script: npm test -- --watch=false
            displayName: Test
            workingDirectory: web

          - script: npm run build
            displayName: Build
            workingDirectory: web

          - publish: web/dist/web/browser
            artifact: web
            displayName: Upload web artifact

  # Deploys every green build of main (not pull requests) to Azure App Service.
  # The API and the website ship together: the Angular build goes into the API's wwwroot folder.
  - stage: Deploy
    displayName: Deploy to Azure
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: Site
        displayName: API and website
        environment: production
        pool:
          ${{ if eq(parameters.buildMachine, 'Microsoft-hosted') }}:
            vmImage: ubuntu-24.04
          ${{ else }}:
            name: Default
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: api
                - download: current
                  artifact: web

                - task: CopyFiles@2
                  displayName: Put the website inside the API's wwwroot
                  inputs:
                    SourceFolder: $(Pipeline.Workspace)/web
                    TargetFolder: $(Pipeline.Workspace)/api/wwwroot

                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/api
